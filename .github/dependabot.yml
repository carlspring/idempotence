# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/" # Location of package manifests
    schedule:
      # Check for updates to Maven dependencies every day
      interval: "daily"
    commit-message:
      prefix: deps(upgrade)
    ignore:
      # Njord fails to start on Maven 3.10.0 (null RepositorySystem); stay on 3.9.x until that is resolved
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [">= 3.10.0"]
    groups:
      spring:
        patterns:
          - "org.springframework*"
      junit:
        patterns:
          - "org.junit*"
      logging:
        patterns:
          - "org.slf4j:*"
          - "ch.qos.logback:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
      njord:
        patterns:
          - "eu.maveniverse.maven.njord:*"
          - "eu.maveniverse.maven.plugins:njord"
  - package-ecosystem: "gradle"
    directory: "/idempotence-gradle-integration-tests"
    schedule:
      # Check for updates to Gradle dependencies every day
      interval: "daily"
    commit-message:
      prefix: deps(upgrade)
    groups:
      groovy:
        patterns:
          - "org.apache.groovy:*"
      junit:
        patterns:
          - "org.junit*"
      gradle-wrapper:
        patterns:
          - "gradle"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every day
      interval: "daily"
    commit-message:
      prefix: deps(upgrade)
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      actions:
        patterns:
          - "actions/*"
