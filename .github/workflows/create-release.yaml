name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version for the release (e.g., 1.0.0, 1.0.0-rc-1)'
        required: false
      next_development_version:
        description: 'Next development version (e.g., 1.0.1-SNAPSHOT)'
        required: false
      aliases:
        description: 'Space-separated alias tags to point at the release (e.g., v1 v1.0)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Ensure all history and tags are fetched

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          cache: 'maven'
          distribution: 'temurin'
          java-version: '22'
          gpg-private-key: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify imported secret key
        run: |
          gpg --batch --list-secret-keys --keyid-format LONG

      - name: Determine Release Version
        id: determine_version
        shell: bash
        run: |
          if [ -z "${{ github.event.inputs.release_version }}" ]; then
            echo "No release_version input provided. Computing next version..."

            # Get the latest version tag (ignoring alias tags such as v1)
            latest_tag=$(git describe --tags --abbrev=0 --match '[0-9]*' "$(git rev-list --tags='[0-9]*' --max-count=1)" 2>/dev/null || true)
            echo "Latest tag: $latest_tag"

            if [ -z "$latest_tag" ]; then
              # No previous tags exist; start with initial version
              release_version="1.0.0"
            else
              # Extract version components based on Maven versioning rules
              version_pattern='^([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$'

              if [[ "$latest_tag" =~ $version_pattern ]]; then
                major="${BASH_REMATCH[1]}"
                minor="${BASH_REMATCH[2]}"
                patch="${BASH_REMATCH[3]}"
                suffix="${BASH_REMATCH[4]}"

                echo "Version components - Major: $major, Minor: $minor, Patch: $patch, Suffix: $suffix"

                if [[ -n "$suffix" ]]; then
                  # Handle pre-release versions (e.g., -rc-1, -milestone-1)
                  suffix_pattern='^-(.+)-([0-9]+)$'

                  if [[ "$suffix" =~ $suffix_pattern ]]; then
                    suffix_type="${BASH_REMATCH[1]}"
                    suffix_number="${BASH_REMATCH[2]}"
                    next_suffix_number=$((suffix_number + 1))
                    release_version="${major}.${minor}.${patch}-${suffix_type}-${next_suffix_number}"
                  else
                    # Unrecognized suffix format; increment patch version
                    next_patch=$((patch + 1))
                    release_version="${major}.${minor}.${next_patch}"
                  fi
                else
                  # No suffix; increment patch version
                  next_patch=$((patch + 1))
                  release_version="${major}.${minor}.${next_patch}"
                fi
              else
                echo "Latest tag does not match expected version pattern. Defaulting to 1.0.0."
                release_version="1.0.0"
              fi
            fi
          else
            echo "Using provided release_version input: ${{ github.event.inputs.release_version }}"
            release_version="${{ github.event.inputs.release_version }}"
          fi

          echo "Release version: $release_version"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Determine Next Development Version
        id: determine_next_version
        shell: bash
        run: |
          if [ -z "${{ github.event.inputs.next_development_version }}" ]; then
            # Assume next development version is release version incremented by patch and with -SNAPSHOT
            version_pattern='^([0-9]+)\.([0-9]+)\.([0-9]+)'

            if [[ "${{ steps.determine_version.outputs.release_version }}" =~ $version_pattern ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              next_patch=$((patch + 1))
              next_development_version="${major}.${minor}.${next_patch}-SNAPSHOT"
            else
              # Default to 1.0.1-SNAPSHOT
              next_development_version="1.0.1-SNAPSHOT"
            fi
          else
            next_development_version="${{ github.event.inputs.next_development_version }}"
          fi

          echo "Next development version: $next_development_version"
          echo "next_development_version=$next_development_version" >> "$GITHUB_OUTPUT"

      - name: Update POM Version to Release Version
        run: |
          mvn versions:set \
              -DnewVersion="${{ steps.determine_version.outputs.release_version }}" \
              -DprocessAllModules=true \
              -DgenerateBackupPoms=false

      - name: Update Gradle Integration Test Versions to Release Version
        run: |
          find idempotence-gradle-integration-tests -name "build.gradle.kts" -exec sed -i \
            -e "s|idempotence-core:[^\"]*\"|idempotence-core:${{ steps.determine_version.outputs.release_version }}\"|g" \
            -e "s|idempotence-gradle:[^\"]*\"|idempotence-gradle:${{ steps.determine_version.outputs.release_version }}\"|g" {} \;

      - name: Commit Release Version
        id: commit_release
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -am "Release version ${{ steps.determine_version.outputs.release_version }}"
          echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and Deploy Artifacts
        run: |
           # The repo ID before '::' is a required-but-unused placeholder for Maven's deploy plugin.
           # 'njord:' is the Njord local-staging URL (uses the default RELEASE store template).
           mvn -s ./.github/settings.xml clean deploy \
               -DskipTests=false \
               -Prelease \
               -DaltDeploymentRepository=local-staging::njord:

      - name: Publish Release Artifacts to Maven Central Portal
        run: |
           mvn -s ./.github/settings.xml njord:publish -Dpublisher=sonatype-cp

      - name: Create Tag and GitHub Release
        uses: carlspring/release-action@0faba8fe09752647ce39a99589c3c7dc34f146a7 # v1.0.5
        with:
          tag: ${{ steps.determine_version.outputs.release_version }}
          target: ${{ steps.commit_release.outputs.release_commit }}
          prerelease: ${{ contains(steps.determine_version.outputs.release_version, '-') }}
          aliases: ${{ github.event.inputs.aliases }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update POM Version to Next Development Version
        run: |
          mvn versions:set -DnewVersion=${{ steps.determine_next_version.outputs.next_development_version }} -DprocessAllModules=true -DgenerateBackupPoms=false
          # mvn -s ./.github/settings.xml clean deploy -DskipTests=false

      - name: Update Gradle Integration Test Versions to Next Development Version
        run: |
          find idempotence-gradle-integration-tests -name "build.gradle.kts" -exec sed -i \
            -e "s|idempotence-core:[^\"]*\"|idempotence-core:${{ steps.determine_next_version.outputs.next_development_version }}\"|g" \
            -e "s|idempotence-gradle:[^\"]*\"|idempotence-gradle:${{ steps.determine_next_version.outputs.next_development_version }}\"|g" {} \;

      - name: Commit Next Development Version
        run: |
          git commit -am "Prepare for next development iteration"
          git push origin HEAD:${{ github.ref }}
