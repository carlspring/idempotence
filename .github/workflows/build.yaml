name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 22
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          cache: 'maven'
          distribution: 'temurin'
          java-version: '22'

      - name: Build with Maven
        run: ./mvnw -B clean package

      - name: Check if version is a SNAPSHOT
        if: github.event_name == 'push'
        id: check_snapshot
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Current version: $VERSION"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
          else
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish Snapshot to Maven Central Portal
        if: github.event_name == 'push' && steps.check_snapshot.outputs.is_snapshot == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          ./mvnw -s ./.github/settings.xml -B deploy -DskipTests=true

      # Pull requests from forks and Dependabot don't get the Maven Central secrets,
      # so PR snapshots are only published for branches in this repository.
      - name: Set PR snapshot version
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        id: set_pr_version
        run: |
          BASE_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//')
          PR_VERSION="${BASE_VERSION}-PR-${{ github.event.number }}-SNAPSHOT"
          echo "pr_version=${PR_VERSION}" >> $GITHUB_OUTPUT
          echo "Setting PR snapshot version to: ${PR_VERSION}"
          ./mvnw -B versions:set -DnewVersion="${PR_VERSION}" -DprocessAllModules=true -DgenerateBackupPoms=false
          find idempotence-gradle-integration-tests -name "build.gradle.kts" -exec sed -i \
            -e "s|idempotence-core:[^\"]*\"|idempotence-core:${PR_VERSION}\"|g" \
            -e "s|idempotence-gradle:[^\"]*\"|idempotence-gradle:${PR_VERSION}\"|g" {} \;

      - name: Publish PR Snapshot to Maven Central Portal
        if: steps.set_pr_version.outcome == 'success'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          ./mvnw -s ./.github/settings.xml -B deploy -DskipTests=true
