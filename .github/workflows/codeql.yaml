name: CodeQL

on:
  push:
    branches: [ master ]
    paths:
      - '**/*.java'
      - '.github/workflows/codeql.yaml'
  pull_request:
    branches: [ master ]
    paths:
      - '**/*.java'
      - '.github/workflows/codeql.yaml'
  schedule:
    - cron: '0 1 * * *' # daily at 1am UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Fetch all history for accurate comparisons

      - name: Check for Java file changes
        id: java_changes
        run: |
          git fetch origin master --prune
          if git diff --name-only HEAD HEAD~1 | grep -E '\.java$'; then
            echo "Java files have changed."
            echo "java_changed=true" >> $GITHUB_ENV
          else
            echo "No Java file changes detected."
            echo "java_changed=false" >> $GITHUB_ENV
          fi

      - name: Setup JDK 22
        if: env.java_changed == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          cache: 'maven'
          distribution: 'temurin'
          java-version: '22'

      - name: Initialize CodeQL
        if: env.java_changed == 'true'
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: 'java'

      - name: Autobuild
        if: env.java_changed == 'true'
        run: mvn -B package --file pom.xml

      - name: Perform CodeQL Analysis
        if: env.java_changed == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
